<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slick plugins · over on Freddie's site</title>
    <meta
      name="description"
      content="The Slick plugins built in collaboration with Freddie live at slick.freddieyershon.co.uk. Taking you there in 20 seconds."
    />
    <link rel="canonical" href="https://slick.freddieyershon.co.uk/" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♣</text></svg>"
    />
    <link rel="stylesheet" href="./styles.css" />
    <noscript><meta http-equiv="refresh" content="20;url=https://slick.freddieyershon.co.uk/" /></noscript>
  </head>
  <body>
    <main>
      <header>
        <h1>Slick plugins</h1>
        <p>
          This was made in collaboration with
          <a href="https://freddieyershon.co.uk">Freddie</a>. His site is where the plugins live now,
          so this page just points you there.
        </p>
      </header>

      <section class="card" aria-labelledby="taking">
        <div class="dial" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="64" height="64">
            <circle class="track" cx="32" cy="32" r="28" />
            <circle class="fill" id="ring" cx="32" cy="32" r="28" />
          </svg>
          <span id="seconds">20</span>
        </div>

        <div class="body">
          <h2 id="taking">Taking you to Freddie's site</h2>
          <p>
            Redirecting automatically in <b id="seconds-text">20</b> seconds, or
            <a class="go" href="https://slick.freddieyershon.co.uk/">go now</a>.
          </p>
          <p class="where">
            <a href="https://slick.freddieyershon.co.uk/">slick.freddieyershon.co.uk</a>
          </p>
        </div>
      </section>

      <p class="stay">
        <button type="button" id="stay">Stay on this page</button>
      </p>

      <p class="status" id="status" role="status" aria-live="polite"></p>

      <footer>
        <p>
          Plugins for <a href="https://github.com/3kh0/slick">Slick</a>, made with
          <a href="https://freddieyershon.co.uk">Freddie</a>.
        </p>
      </footer>
    </main>

    <script src="./redirect.js"></script>
  </body>
</html>
